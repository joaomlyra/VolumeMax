<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>VolumeMax</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      background: #1a1a2e;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      user-select: none;
    }

    header {
      background: linear-gradient(135deg, #6c63ff, #3f51b5);
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header svg { flex-shrink: 0; }

    header .titles { display: flex; flex-direction: column; }
    header h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
    header span { font-size: 11px; opacity: 0.8; }

    .section {
      padding: 14px 16px;
      border-bottom: 1px solid #2a2a4a;
    }

    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 10px;
    }

    /* Volume Knob Area */
    .volume-display {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }

    .knob-wrapper {
      position: relative;
      width: 72px;
      height: 72px;
      flex-shrink: 0;
    }

    #knobCanvas {
      cursor: pointer;
      border-radius: 50%;
    }

    .volume-info { flex: 1; }

    .volume-percent {
      font-size: 32px;
      font-weight: 800;
      color: #6c63ff;
      line-height: 1;
    }

    .volume-percent span { font-size: 16px; font-weight: 500; color: #aaa; }

    .volume-label {
      font-size: 11px;
      color: #777;
      margin-top: 3px;
    }

    /* Slider */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slider-icon { font-size: 14px; opacity: 0.6; }

    input[type=range] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      border-radius: 3px;
      background: #2a2a4a;
      outline: none;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #6c63ff;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(108,99,255,0.6);
    }

    input[type=range]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #6c63ff;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 6px rgba(108,99,255,0.6);
    }

    /* Quick presets */
    .presets {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .preset-btn {
      background: #2a2a4a;
      border: 1px solid #3a3a6a;
      color: #ccc;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .preset-btn:hover { background: #6c63ff; border-color: #6c63ff; color: white; }
    .preset-btn.active { background: #6c63ff; border-color: #6c63ff; color: white; }

    /* Mute toggle */
    .controls-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .ctrl-btn {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #3a3a6a;
      background: #2a2a4a;
      color: #ccc;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s;
    }

    .ctrl-btn:hover { background: #3a3a6a; }
    .ctrl-btn.muted { background: #c0392b; border-color: #c0392b; color: white; }
    .ctrl-btn.reset { }

    /* Tab volume list */
    #tabList { max-height: 160px; overflow-y: auto; }

    #tabList::-webkit-scrollbar { width: 4px; }
    #tabList::-webkit-scrollbar-track { background: transparent; }
    #tabList::-webkit-scrollbar-thumb { background: #3a3a6a; border-radius: 2px; }

    .tab-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 4px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s;
    }

    .tab-item:hover { background: #252545; }
    .tab-item.active-tab { background: #1e1e40; }

    .tab-favicon {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .tab-favicon-placeholder {
      width: 16px;
      height: 16px;
      background: #3a3a6a;
      border-radius: 3px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
    }

    .tab-name {
      flex: 1;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ccc;
    }

    .tab-vol-badge {
      font-size: 10px;
      font-weight: 700;
      color: #6c63ff;
      min-width: 34px;
      text-align: right;
    }

    .tab-mini-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 60px;
      height: 3px;
      border-radius: 2px;
      background: #2a2a4a;
      outline: none;
      cursor: pointer;
    }

    .tab-mini-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #6c63ff;
    }

    .tab-mini-slider::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #6c63ff;
      border: none;
    }

    footer {
      padding: 8px 16px;
      text-align: center;
      font-size: 10px;
      color: #444;
    }
  </style>
</head>
<body>

<header>
  <svg width="28" height="28" viewBox="0 0 48 48">
    <polygon points="6,17 6,31 16,31 27,41 27,7 16,17" fill="white"/>
    <line x1="33" y1="17" x2="33" y2="31" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="39" y1="13" x2="39" y2="35" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <div class="titles">
    <h1>VolumeMax</h1>
    <span>Per-tab audio control</span>
  </div>
</header>

<!-- Current tab volume -->
<div class="section">
  <div class="section-title">Current Tab</div>
  <div class="volume-display">
    <div class="knob-wrapper">
      <canvas id="knobCanvas" width="72" height="72"></canvas>
    </div>
    <div class="volume-info">
      <div class="volume-percent" id="percentDisplay">100<span>%</span></div>
      <div class="volume-label" id="tabTitle">Loading...</div>
    </div>
  </div>
  <div class="slider-row">
    <span class="slider-icon">🔈</span>
    <input type="range" id="volumeSlider" min="0" max="600" value="100" step="1" />
    <span class="slider-icon">🔊</span>
  </div>
</div>

<!-- Presets -->
<div class="section">
  <div class="section-title">Quick Presets</div>
  <div class="presets">
    <button class="preset-btn" data-v="0">Mudo</button>
    <button class="preset-btn" data-v="50">50%</button>
    <button class="preset-btn active" data-v="100">100%</button>
    <button class="preset-btn" data-v="150">150%</button>
    <button class="preset-btn" data-v="200">200%</button>
    <button class="preset-btn" data-v="400">400%</button>
    <button class="preset-btn" data-v="600">600%</button>
  </div>
</div>

<!-- Controls -->
<div class="section">
  <div class="controls-row">
    <button class="ctrl-btn" id="muteBtn">🔇 Mute tab</button>
    <button class="ctrl-btn reset" id="resetBtn">↺ Reset (100%)</button>
  </div>
</div>

<!-- All tabs -->
<div class="section" style="border-bottom:none">
  <div class="section-title">All Tabs</div>
  <div id="tabList">Loading tabs...</div>
</div>

<p id="status" role="status" style="padding:0 16px;color:#bbb;font-size:12px">Conectando ao player…</p>
<footer>VolumeMax for Firefox · v1.1.0</footer>

<script src="popup.js"></script>
</body>
</html>
